<script>
const $ = x => document.querySelector(x);

const toast = message => {
  const t = $('#toast');
  t.textContent = message;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
};

let credits = Number(localStorage.amohCredits || 100);
let generated = Number(localStorage.amohGenerated || 0);
let duration = 6;

function save() {
  localStorage.amohCredits = credits;
  localStorage.amohGenerated = generated;
  $('#creditsPill').textContent = credits + ' credits';
}

save();

$('#prompt').oninput = e => {
  $('#count').textContent = e.target.value.length + '/1200';
};

document.querySelectorAll('[data-d]').forEach(button => {
  button.onclick = () => {
    document.querySelectorAll('[data-d]').forEach(x =>
      x.classList.remove('active')
    );

    button.classList.add('active');
    duration = Number(button.dataset.d);

    $('#cost').textContent = duration === 6 ? 10 : 15;
  };
});

$('#image').onchange = e => {
  if (e.target.files[0]) {
    toast('Image selected: ' + e.target.files[0].name);
  }
};

async function checkVideoStatus(taskId, cost) {
  const maxAttempts = 120;

  for (let attempt = 0; attempt < maxAttempts; attempt++) {
    await new Promise(resolve => setTimeout(resolve, 5000));

    const response = await fetch(
      '/api/status?taskId=' + encodeURIComponent(taskId)
    );

    const raw = await response.text();

    let data;

    try {
      data = JSON.parse(raw);
    } catch {
      throw new Error(
        raw.slice(0, 250) || 'Invalid response from video service.'
      );
    }

    if (!response.ok) {
      throw new Error(data.error || 'Could not check video status.');
    }

    if (data.status === 'SUCCEEDED') {
      if (!data.videoUrl) {
        throw new Error('Video completed but no video URL was returned.');
      }

      credits -= cost;
      generated++;
      save();

      $('#result').innerHTML =
        '<video controls autoplay src="' +
        data.videoUrl +
        '"></video>';

      $('#download').href = data.videoUrl;
      $('#download').classList.remove('disabled');

      $('#state').textContent = 'COMPLETE';

      toast('Video generated. ' + cost + ' credits used.');

      if (generated === 3) {
        toast('🎉 Optional referral reward unlocked!');
      }

      return;
    }

    if (data.status === 'FAILED') {
      throw new Error(
        data.error || 'Runway could not generate the video.'
      );
    }

    $('#state').textContent =
      data.status === 'RUNNING' ||
      data.status === 'PENDING' ||
      data.status === 'THROTTLED'
        ? 'GENERATING'
        : String(data.status || 'GENERATING');
  }

  throw new Error(
    'The video is taking too long. Please try again.'
  );
}

$('#generate').onclick = async () => {
  const prompt = $('#prompt').value.trim();
  const cost = duration === 6 ? 10 : 15;
  const imageFile = $('#image').files[0];
  const ratio = $('#ratio').value;

  if (!prompt) {
    return toast('Write a prompt first.');
  }

  if (credits < cost) {
    return toast('Not enough credits. Buy more credits.');
  }

  if (!imageFile && ratio === '960:960') {
    return toast(
      'For text-only video, choose Landscape or Portrait.'
    );
  }

  $('#generate').disabled = true;
  $('#generate').textContent = 'Generating…';
  $('#state').textContent = 'GENERATING';

  try {
    /*
      IMPORTANT:
      Do NOT send promptImage when there is no image.
    */

    const requestBody = {
      prompt,
      duration,
      ratio
    };

    if (imageFile) {
      if (imageFile.size > 6 * 1024 * 1024) {
        throw new Error(
          'Image is too large. Please choose an image under 6 MB.'
        );
      }

      const promptImage = await new Promise((resolve, reject) => {
        const reader = new FileReader();

        reader.onload = () => resolve(reader.result);

        reader.onerror = () =>
          reject(
            new Error('Could not read the image.')
          );

        reader.readAsDataURL(imageFile);
      });

      requestBody.promptImage = promptImage;
    }

    const response = await fetch('/api/generate', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(requestBody)
    });

    const raw = await response.text();

    let data;

    try {
      data = JSON.parse(raw);
    } catch {
      throw new Error(
        raw.slice(0, 250) ||
        'The video service returned an invalid response.'
      );
    }

    if (!response.ok) {
      throw new Error(
        data.error || 'Generation failed.'
      );
    }

    if (!data.taskId) {
      throw new Error(
        'The video service did not return a task ID.'
      );
    }

    await checkVideoStatus(data.taskId, cost);

  } catch (error) {
    console.error(error);

    $('#state').textContent = 'NOT CONNECTED';

    toast(
      error.message || 'Generation failed.'
    );

  } finally {
    $('#generate').disabled = false;

    $('#generate').innerHTML =
      '✨ Generate video · <span id="cost">' +
      cost +
      '</span> credits';
  }
};

$('#new').onclick = () => {
  location.reload();
};

document.querySelectorAll('.buy').forEach(button => {
  button.onclick = () => {
    toast(
      'Payment checkout will use your configured Paystack account.'
    );
  };
});

$('#ref').onclick = () => {
  if (generated < 3) {
    const remaining = 3 - generated;

    return toast(
      'Generate ' +
      remaining +
      ' more video' +
      (remaining === 1 ? '' : 's') +
      ' to unlock the optional referral.'
    );
  }

  const id =
    crypto.randomUUID
      ? crypto.randomUUID()
      : Math.random().toString(36);

  const link =
    location.origin + '/?ref=' + id;

  navigator.clipboard?.writeText(link);

  toast(
    'Referral link copied. Share it to earn 10 credits after qualification.'
  );
};
</script>
